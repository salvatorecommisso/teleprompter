<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>Teleprompter</title>
<style>
:root{--bg:#111;--panel:#1c1c1e;--line:#333;--text:#f2f2f2;--muted:#9a9a9f;--accent:#4da3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
.view{display:none;min-height:100%;padding:max(16px,env(safe-area-inset-top)) 16px 24px}
.view.on{display:block}
h1{font-size:24px;margin:8px 0 16px}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:600}
button.danger{color:#ff6b6b}
input[type=text],input[type=password],textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:50vh;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.card .t{font-weight:600}.card .s{color:var(--muted);font-size:13px}
.muted{color:var(--muted);font-size:14px}
#lock{text-align:center;padding-top:20vh}
#lock input{max-width:220px;text-align:center;font-size:24px;letter-spacing:6px;margin:12px auto;display:block}
#err{color:#ff6b6b;min-height:22px}
#stage{position:fixed;inset:0;background:#000;overflow:hidden;display:none}
#stage.on{display:block}
#scroller{position:absolute;inset:0;overflow:hidden}
#text{padding:45vh 8vw 80vh;font-weight:600;line-height:1.5;white-space:pre-wrap;text-align:center;color:#fff}
#text.mirror{transform:scaleX(-1)}
#guide{position:absolute;left:0;right:0;top:40%;height:2px;background:rgba(77,163,255,.5);pointer-events:none}
#bar{position:absolute;left:0;right:0;bottom:0;background:rgba(20,20,22,.92);padding:10px 12px max(10px,env(safe-area-inset-bottom));display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;transition:opacity .2s}
#bar.hide{opacity:0;pointer-events:none}
#bar label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
#bar input[type=range]{width:110px}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:30vw;font-weight:700;background:rgba(0,0,0,.7)}
</style>
</head>
<body>

<section id="lock" class="view">
  <h1 id="lockTitle">Enter passcode</h1>
  <p class="muted" id="lockHint"></p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••">
  <div id="err"></div>
  <button class="primary" id="pinGo">Unlock</button>
</section>

<section id="list" class="view">
  <h1>Scripts</h1>
  <div class="row" style="margin-bottom:14px">
    <button class="primary" id="newBtn">New script</button>
    <button id="lockBtn">Lock now</button>
    <button id="pinBtn">Change passcode</button>
  </div>
  <div id="items"></div>
  <p class="muted">Scripts are saved only in this browser on this device. The passcode is a light privacy lock, not strong encryption.</p>
</section>

<section id="edit" class="view">
  <h1>Edit script</h1>
  <input type="text" id="title" placeholder="Title" style="margin-bottom:10px">
  <textarea id="body" placeholder="Paste or type your script here"></textarea>
  <div class="row" style="margin-top:12px">
    <button class="primary" id="saveBtn">Save</button>
    <button id="playBtn">Save and play</button>
    <button id="cancelBtn">Back</button>
    <button class="danger" id="delBtn">Delete</button>
  </div>
</section>

<div id="stage">
  <div id="scroller"><div id="text"></div></div>
  <div id="guide"></div>
  <div id="count"></div>
  <div id="bar">
    <button id="pp" class="primary">Play</button>
    <label>Speed <input type="range" id="speed" min="10" max="300" value="70"></label>
    <label>Size <input type="range" id="size" min="24" max="140" value="56"></label>
    <label><input type="checkbox" id="mirror"> Mirror</label>
    <button id="toTop">Restart</button>
    <button id="exit">Exit</button>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var K={pin:"tp_pin",scripts:"tp_scripts",set:"tp_settings"};
  function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  var scripts=load(K.scripts,[]);
  var settings=load(K.set,{speed:70,size:56,mirror:false});
  var current=null,unlocked=false,settingPin=false;

  function show(id){["lock","list","edit"].forEach(function(v){$(v).classList.toggle("on",v===id)})}
  function sha(s){
    var b=new TextEncoder().encode("tp:"+s);
    return crypto.subtle.digest("SHA-256",b).then(function(h){
      return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")});
  }

  function gate(){
    var has=load(K.pin,null);
    unlocked=false;$("pin").value="";$("err").textContent="";
    if(has){$("lockTitle").textContent="Enter passcode";$("lockHint").textContent="";$("pinGo").textContent="Unlock";settingPin=false}
    else{$("lockTitle").textContent="Set a passcode";$("lockHint").textContent="Choose 4 or more digits. You will need it each time you open Scripts.";$("pinGo").textContent="Set passcode";settingPin=true}
    show("lock");$("pin").focus();
  }
  $("pinGo").onclick=function(){
    var v=$("pin").value.trim();
    if(settingPin){
      if(v.length<4){$("err").textContent="Use at least 4 characters.";return}
      sha(v).then(function(h){save(K.pin,h);unlocked=true;renderList();show("list")});
    }else{
      sha(v).then(function(h){
        if(h===load(K.pin,null)){unlocked=true;renderList();show("list")}
        else{$("err").textContent="Wrong passcode.";$("pin").value=""}
      });
    }
  };
  $("pin").onkeydown=function(e){if(e.key==="Enter")$("pinGo").click()};
  $("lockBtn").onclick=gate;
  $("pinBtn").onclick=function(){try{localStorage.removeItem(K.pin)}catch(e){}gate()};

  function renderList(){
    var box=$("items");box.innerHTML="";
    if(!scripts.length){box.innerHTML='<p class="muted">No scripts yet. Tap New script to add one.</p>';return}
    scripts.forEach(function(s){
      var c=document.createElement("div");c.className="card";
      var words=(s.body.trim().match(/\S+/g)||[]).length;
      c.innerHTML='<div><div class="t"></div><div class="s">'+words+' words, about '+Math.max(1,Math.round(words/150))+' min</div></div>';
      c.querySelector(".t").textContent=s.title||"Untitled";
      var r=document.createElement("div");r.className="row";
      var p=document.createElement("button");p.className="primary";p.textContent="Play";p.onclick=function(){play(s)};
      var e=document.createElement("button");e.textContent="Edit";e.onclick=function(){openEdit(s)};
      r.appendChild(p);r.appendChild(e);c.appendChild(r);box.appendChild(c);
    });
  }

  function openEdit(s){
    current=s||null;
    $("title").value=s?s.title:"";$("body").value=s?s.body:"";
    $("delBtn").style.display=s?"":"none";
    show("edit");
  }
  function commit(){
    var t=$("title").value.trim()||"Untitled",b=$("body").value;
    if(current){current.title=t;current.body=b}
    else{current={id:Date.now(),title:t,body:b};scripts.unshift(current)}
    save(K.scripts,scripts);
  }
  $("newBtn").onclick=function(){openEdit(null)};
  $("saveBtn").onclick=function(){commit();renderList();show("list")};
  $("playBtn").onclick=function(){commit();renderList();play(current)};
  $("cancelBtn").onclick=function(){renderList();show("list")};
  $("delBtn").onclick=function(){
    if(current&&confirm("Delete this script?")){
      scripts=scripts.filter(function(x){return x!==current});save(K.scripts,scripts);renderList();show("list")}
  };

  /* player */
  var raf=null,playing=false,last=0,pos=0,hideT=null;
  var sc=$("scroller"),tx=$("text");
  function applySettings(){
    $("speed").value=settings.speed;$("size").value=settings.size;$("mirror").checked=settings.mirror;
    tx.style.fontSize=settings.size+"px";tx.classList.toggle("mirror",settings.mirror);
  }
  function play(s){
    tx.textContent=s.body;applySettings();pos=0;sc.scrollTop=0;
    $("stage").classList.add("on");setPlaying(false);
    if(document.documentElement.requestFullscreen){try{document.documentElement.requestFullscreen()}catch(e){}}
    try{if(navigator.wakeLock)navigator.wakeLock.request("screen").catch(function(){})}catch(e){}
    wake();
  }
  function setPlaying(v){
    playing=v;$("pp").textContent=v?"Pause":"Play";
    cancelAnimationFrame(raf);
    if(v){last=performance.now();raf=requestAnimationFrame(tick)}
  }
  function tick(t){
    var dt=(t-last)/1000;last=t;
    pos+=settings.speed*dt;sc.scrollTop=pos;
    if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1){setPlaying(false);return}
    raf=requestAnimationFrame(tick);
  }
  function countdown(cb){
    var n=3,el=$("count");el.style.display="flex";el.textContent=n;
    var iv=setInterval(function(){n--;if(n<=0){clearInterval(iv);el.style.display="none";cb()}else el.textContent=n},800);
  }
  $("pp").onclick=function(){
    if(playing){setPlaying(false)}
    else if(pos<=0.5){countdown(function(){setPlaying(true)})}
    else setPlaying(true);
    wake();
  };
  $("toTop").onclick=function(){setPlaying(false);pos=0;sc.scrollTop=0;wake()};
  $("exit").onclick=function(){
    setPlaying(false);$("stage").classList.remove("on");
    if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();
  };
  $("speed").oninput=function(){settings.speed=+this.value;save(K.set,settings)};
  $("size").oninput=function(){settings.size=+this.value;tx.style.fontSize=settings.size+"px";save(K.set,settings)};
  $("mirror").onchange=function(){settings.mirror=this.checked;tx.classList.toggle("mirror",settings.mirror);save(K.set,settings)};
  function wake(){
    $("bar").classList.remove("hide");clearTimeout(hideT);
    hideT=setTimeout(function(){if(playing)$("bar").classList.add("hide")},3500);
  }
  $("stage").addEventListener("pointerdown",function(e){
    if(e.target.closest("#bar"))return;
    if($("bar").classList.contains("hide")){wake()}else{$("pp").click()}
  });
  sc.addEventListener("wheel",function(e){pos=Math.max(0,pos+e.deltaY);sc.scrollTop=pos},{passive:true});
  document.addEventListener("keydown",function(e){
    if(!$("stage").classList.contains("on"))return;
    if(e.code==="Space"){e.preventDefault();$("pp").click()}
    if(e.key==="ArrowUp"){settings.speed=Math.min(300,settings.speed+10);applySettings();save(K.set,settings)}
    if(e.key==="ArrowDown"){settings.speed=Math.max(10,settings.speed-10);applySettings();save(K.set,settings)}
    if(e.key==="Escape")$("exit").click();
  });

  gate();
})();
</script>
</body>
</html>
